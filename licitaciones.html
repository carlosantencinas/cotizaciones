<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ing. Antequera — Gestor de Licitaciones</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/tu-usuario/tu-repo/main/favicon.ico">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           ESTILOS - Misma paleta que la suite principal
           ============================================================ */
        :root {
            --bg: #F2F0EB;
            --surface: #FFFFFF;
            --surface-hover: #F8F7F4;
            --border: #D9D6CE;
            --text: #1E1E1E;
            --text-soft: #5A5A5A;
            --primary: #1A4A5C;
            --primary-light: #3A7A8F;
            --accent: #B8862E;
            --accent-light: #D4A854;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
            --transition: 0.2s ease;
            --success: #27AE60;
            --danger: #C0392B;
            --warning: #F39C12;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }
        ::selection { background: var(--accent); color: #fff; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* ---- SIDEBAR ---- */
        #sidebar {
            width: 240px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 8px;
            overflow-y: auto;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .brand-stamp {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            overflow: hidden;
            flex-shrink: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--primary);
        }
        .brand-stamp img { width: 100%; height: 100%; object-fit: cover; }
        .brand-txt .t1 { font-weight: 700; font-size: 14px; line-height: 1.2; color: var(--primary); }
        .brand-txt .t2 { font-size: 11px; color: var(--text-soft); }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius);
            border: none;
            background: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-soft);
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: var(--transition);
        }
        .nav-btn:hover { background: var(--surface-hover); color: var(--text); }
        .nav-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(26,74,92,0.2);
        }
        .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
        .nav-foot {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 10.5px;
            color: var(--text-soft);
        }
        .nav-user {
            padding: 12px 12px 8px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-soft);
        }
        .nav-user .email { font-weight: 500; color: var(--text); word-break: break-all; }
        .nav-user .logout-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 11px;
            cursor: pointer;
            color: var(--text-soft);
            margin-top: 6px;
            transition: var(--transition);
        }
        .nav-user .logout-btn:hover { background: #FDF2F0; border-color: var(--danger); color: var(--danger); }

        /* ---- MAIN ---- */
        main {
            flex: 1;
            padding: 32px 40px 60px;
            max-width: 1400px;
            overflow-y: auto;
            height: 100vh;
        }
        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .page-head h1 { font-size: 24px; font-weight: 700; color: var(--primary); margin: 0 0 4px; }
        .page-head p { color: var(--text-soft); font-size: 14px; margin: 0; }
        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0 0 4px;
        }
        .page-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            padding: 9px 18px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:hover { background: var(--accent-light); }
        .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
        .btn-ghost:hover { background: var(--surface-hover); }
        .btn-danger { background: transparent; color: var(--danger); border-color: #F5D6D3; }
        .btn-danger:hover { background: #FDF2F0; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #219A52; }
        .btn-word { background: #2B579A; color: #fff; }
        .btn-word:hover { background: #1A3F6E; }

        /* ---- LOGIN ---- */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
            background: var(--bg);
        }
        .login-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 36px;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }
        .login-box h2 { font-size: 22px; color: var(--primary); margin-bottom: 8px; }
        .login-box .sub { color: var(--text-soft); font-size: 14px; margin-bottom: 24px; }
        .login-box .field { margin-bottom: 16px; }
        .login-box .field label { font-size: 12px; font-weight: 500; color: var(--text); display: block; margin-bottom: 4px; }
        .login-box .field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            transition: var(--transition);
        }
        .login-box .field input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,74,92,0.1);
        }
        .login-box .btn { width: 100%; justify-content: center; margin-top: 4px; }
        .login-box .toggle-link {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-soft);
        }
        .login-box .toggle-link a {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .login-box .toggle-link a:hover { text-decoration: underline; }
        .login-box .error {
            color: var(--danger);
            font-size: 13px;
            padding: 8px 12px;
            background: #FDF2F0;
            border-radius: var(--radius);
            margin-bottom: 12px;
            display: none;
        }
        .login-box .error.show { display: block; }
        .login-box .forgot-password {
            text-align: center;
            margin-top: 8px;
            font-size: 12px;
        }
        .login-box .forgot-password a {
            color: var(--text-soft);
            cursor: pointer;
            text-decoration: none;
        }
        .login-box .forgot-password a:hover { text-decoration: underline; }

        /* ---- PANELES ---- */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .panel + .panel { margin-top: 20px; }
        .panel-h {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .panel-h h3 { font-size: 15px; font-weight: 600; color: var(--primary); margin: 0; }
        .panel-body { padding: 18px 20px; }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .kpi {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            position: relative;
            overflow: hidden;
        }
        .kpi::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
        }
        .kpi.accent::before { background: var(--accent); }
        .kpi.success::before { background: var(--success); }
        .kpi.danger::before { background: var(--danger); }
        .kpi .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 6px; }
        .kpi .val { font-size: 24px; font-weight: 700; color: var(--primary); }
        .kpi .sub { font-size: 12px; color: var(--text-soft); margin-top: 4px; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        th {
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-soft);
            border-bottom: 1.5px solid var(--border);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        th:hover { background: var(--surface-hover); }
        th .sort-icon {
            font-size: 10px;
            margin-left: 4px;
            opacity: 0.5;
        }
        th.active .sort-icon { opacity: 1; }

        .tnum { font-family: 'JetBrains Mono', monospace; }
        .tright { text-align: right; }

        .rowactions { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
        .iconbtn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 7px;
            cursor: pointer;
            color: var(--text-soft);
            display: inline-flex;
            transition: var(--transition);
        }
        .iconbtn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
        .iconbtn svg { width: 14px; height: 14px; }

        .stamp {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1.5px solid currentColor;
        }
        .stamp.presentada { color: var(--text-soft); background: #F0EFEB; }
        .stamp.evaluacion { color: var(--warning); background: #FDF5E6; }
        .stamp.adjudicada { color: var(--success); background: #E8F5ED; }
        .stamp.no-adjudicada { color: var(--danger); background: #FDF2F0; }
        .stamp.en-curso { color: var(--accent); background: #F5ECD9; }

        .empty { padding: 40px 20px; text-align: center; color: var(--text-soft); }
        .empty svg { width: 40px; height: 40px; opacity: 0.3; margin-bottom: 12px; }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            padding: 12px 16px;
            background: #F0F2F5;
            border-radius: var(--radius);
            align-items: center;
        }
        .filter-bar label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-soft);
        }
        .filter-bar input, .filter-bar select {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            background: #fff;
            min-width: 100px;
        }
        .filter-bar input:focus, .filter-bar select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,74,92,0.1);
        }
        .filter-bar .filter-clear {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-soft);
            cursor: pointer;
            text-decoration: underline;
        }
        .filter-bar .filter-clear:hover { color: var(--danger); }

        /* ---- MODAL ---- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px;
            overflow-y: auto;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 720px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }
        .modal-h {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-h h3 { font-size: 17px; font-weight: 600; color: var(--primary); margin: 0; }
        .modal-h .close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-soft); padding: 0 4px; }
        .modal-body { padding: 22px 24px; max-height: 70vh; overflow-y: auto; }
        .modal-foot {
            padding: 14px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-soft);
            margin-bottom: 5px;
            font-weight: 500;
        }
        .field input, .field textarea, .field select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            background: #fff;
            color: var(--text);
            transition: var(--transition);
        }
        .field input:focus, .field textarea:focus, .field select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,74,92,0.1);
        }
        .field textarea { resize: vertical; min-height: 60px; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

        /* ---- TOAST ---- */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--primary);
            color: #fff;
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 13px;
            box-shadow: var(--shadow-lg);
            z-index: 200;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.25s ease;
            pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateY(0); }

        /* ---- GRÁFICO DE ESTADOS ---- */
        .chart-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .chart-bar-row .label {
            width: 130px;
            flex-shrink: 0;
            font-weight: 500;
        }
        .chart-bar-row .track {
            flex: 1;
            height: 18px;
            background: var(--gantt-bg);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .chart-bar-row .track .fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .chart-bar-row .value {
            width: 40px;
            flex-shrink: 0;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            #sidebar { width: 64px; padding: 16px 8px; }
            .brand-txt { display: none; }
            .nav-btn span { display: none; }
            .nav-btn { justify-content: center; padding: 10px; }
            .nav-foot { display: none; }
            .nav-user { display: none; }
            main { padding: 20px 16px; }
            .row2, .row3 { grid-template-columns: 1fr; }
            .page-head { flex-direction: column; }
            .login-box { padding: 28px 20px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar .filter-clear { margin-left: 0; text-align: right; }
        }
        @media (max-width: 480px) {
            .kpi-grid { grid-template-columns: 1fr 1fr; }
        }
        #app-container { display: none; width: 100%; }
        #login-container { display: flex; }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="login-container" class="login-container">
        <div class="login-box">
            <h2>Ing. Antequera</h2>
            <p class="sub">Gestor de Licitaciones y Contactos</p>
            <div id="login-error" class="error"></div>
            
            <form id="login-form" action="javascript:void(0)">
                <div class="field">
                    <label for="login-email">Correo electrónico</label>
                    <input type="email" id="login-email" placeholder="tu@email.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-login">Iniciar sesión</button>
                <div class="toggle-link">
                    ¿No tienes cuenta? <a id="goto-register">Regístrate aquí</a>
                </div>
                <div class="forgot-password">
                    <a id="goto-reset">¿Olvidaste tu contraseña?</a>
                </div>
            </form>

            <form id="register-form" action="javascript:void(0)" style="display:none;">
                <div class="field">
                    <label for="register-email">Correo electrónico</label>
                    <input type="email" id="register-email" placeholder="tu@email.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="register-password">Contraseña</label>
                    <input type="password" id="register-password" placeholder="•••••••• (mínimo 6 caracteres)" autocomplete="new-password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" id="btn-register">Crear cuenta</button>
                <div class="toggle-link">
                    ¿Ya tienes cuenta? <a id="goto-login">Inicia sesión aquí</a>
                </div>
            </form>

            <form id="reset-form" action="javascript:void(0)" style="display:none;">
                <div class="field">
                    <label for="reset-email">Correo electrónico</label>
                    <input type="email" id="reset-email" placeholder="tu@email.com" autocomplete="email" required>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-reset">Enviar correo de recuperación</button>
                <div class="toggle-link">
                    <a id="goto-login-reset">Volver al inicio de sesión</a>
                </div>
            </form>
        </div>
    </div>

    <!-- APP -->
    <div id="app-container">
        <aside id="sidebar">
            <div class="brand">
                <div class="brand-stamp" id="brand-stamp">CAE</div>
                <div class="brand-txt">
                    <div class="t1">Ing. Antequera</div>
                    <div class="t2">Hidráulica · Hidrología</div>
                </div>
            </div>
            <nav id="nav"></nav>
            <div class="nav-user">
                <div class="email" id="user-email">usuario@email.com</div>
                <button class="logout-btn" id="btn-logout">Cerrar sesión</button>
                <a href="index.html" class="btn btn-sm btn-ghost" style="margin-top:6px;width:100%;justify-content:center;">← Volver a Suite</a>
            </div>
            <div class="nav-foot mono">v1.0 · Licitaciones</div>
        </aside>
        <main id="main"></main>
    </div>

    <div id="toast"></div>

    <script>
        // ============================================================
        // FUNCIONES GLOBALES
        // ============================================================
        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        function bs(n) {
            return 'Bs ' + (Number(n) || 0).toLocaleString('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function fmtDate(s) {
            if (!s) return '—';
            const d = new Date(s + 'T00:00:00');
            return isNaN(d) ? s : d.toLocaleDateString('es-BO', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function esc(s) {
            return String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        }

        function attr(s) {
            return esc(s).replace(/"/g, '&quot;');
        }

        // ============================================================
        // STATE
        // ============================================================
        const S = {
            view: 'dashboard',
            licitaciones: [],
            contactos: [],
            user: null,
            // Filtros
            licFilters: { convocatoria: '', proyecto: '', estado: '', entidad: '' },
            licSort: { column: null, direction: 'asc' },
            contFilters: { nombre: '', empresa: '', cargo: '' },
            contSort: { column: null, direction: 'asc' }
        };

        // ============================================================
        // ICONS
        // ============================================================
        const ICONS = {
            dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
            lic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 22v-4M4 12H2h2M22 12h-2M4 4l2.5 2.5M17.5 17.5L20 20M4 20l2.5-2.5M17.5 6.5L20 4"/><circle cx="12" cy="12" r="4"/></svg>',
            contact: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
            plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
            edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
            trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
            excel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M8 12l3 3-3 3M14 12l-3 3 3 3"/></svg>',
            empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>'
        };

        // ============================================================
        // FIREBASE
        // ============================================================
        const LS_PREFIX = 'licitaciones_';
        let fbApp = null;
        let fbAuth = null;
        let fbDb = null;
        let cloudReady = false;

        function getSavedFirebaseConfig() {
            try {
                const raw = localStorage.getItem('hidro_firebase_config');
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        async function initFirebase() {
            const cfg = getSavedFirebaseConfig();
            if (!cfg) {
                document.getElementById('login-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
                showLoginError('⚠️ Configura Firebase primero (usa la misma que en la Suite principal).');
                return;
            }
            try {
                fbApp = firebase.initializeApp(cfg);
                fbAuth = firebase.auth();
                fbDb = firebase.firestore();
                cloudReady = true;
                await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                fbAuth.onAuthStateChanged(async (user) => {
                    S.user = user;
                    if (user) {
                        document.getElementById('login-container').style.display = 'none';
                        document.getElementById('app-container').style.display = 'flex';
                        document.getElementById('user-email').textContent = user.email || 'usuario@email.com';
                        await loadData(user.uid);
                        render();
                    } else {
                        document.getElementById('login-container').style.display = 'flex';
                        document.getElementById('app-container').style.display = 'none';
                    }
                });
            } catch (e) {
                console.error('Firebase init failed', e);
                document.getElementById('login-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
                showLoginError('Error al conectar con Firebase.');
            }
        }

        // ============================================================
        // AUTENTICACIÓN
        // ============================================================
        async function login(email, password) {
            try {
                await fbAuth.signInWithEmailAndPassword(email, password);
                hideLoginError();
                return true;
            } catch (e) {
                let msg = e.message;
                if (e.code === 'auth/user-not-found') msg = '❌ No existe una cuenta con este correo.';
                else if (e.code === 'auth/wrong-password') msg = '❌ Contraseña incorrecta.';
                else if (e.code === 'auth/invalid-credential') msg = '❌ Credenciales inválidas.';
                else if (e.code === 'auth/too-many-requests') msg = '⏳ Demasiados intentos fallidos.';
                else if (e.code === 'auth/network-request-failed') msg = '🌐 Error de red.';
                showLoginError(msg);
                return false;
            }
        }

        async function register(email, password) {
            try {
                await fbAuth.createUserWithEmailAndPassword(email, password);
                hideLoginError();
                return true;
            } catch (e) {
                let msg = e.message;
                if (e.code === 'auth/email-already-in-use') msg = '📧 Este correo ya está registrado.';
                else if (e.code === 'auth/weak-password') msg = '🔑 La contraseña es demasiado débil.';
                else if (e.code === 'auth/invalid-email') msg = '📧 Correo electrónico inválido.';
                showLoginError(msg);
                return false;
            }
        }

        async function resetPassword(email) {
            try {
                await fbAuth.sendPasswordResetEmail(email);
                hideLoginError();
                toast('📧 Se envió un correo de recuperación a ' + email);
                return true;
            } catch (e) {
                let msg = e.message;
                if (e.code === 'auth/user-not-found') msg = 'No existe una cuenta con este correo.';
                else if (e.code === 'auth/invalid-email') msg = 'Correo electrónico inválido.';
                showLoginError(msg);
                return false;
            }
        }

        async function logout() {
            await fbAuth.signOut();
            S.user = null;
            document.getElementById('login-container').style.display = 'flex';
            document.getElementById('app-container').style.display = 'none';
        }

        function showLoginError(msg) {
            const el = document.getElementById('login-error');
            el.textContent = msg;
            el.classList.add('show');
        }

        function hideLoginError() {
            document.getElementById('login-error').classList.remove('show');
        }

        // ============================================================
        // CRUD
        // ============================================================
        async function cloudGet(userId, key) {
            if (!cloudReady || !fbDb) return localStorage.getItem(LS_PREFIX + userId + '_' + key);
            try {
                const snap = await fbDb.collection('users').doc(userId).collection('data').doc(key).get();
                return snap.exists ? snap.data().value : null;
            } catch (e) {
                return localStorage.getItem(LS_PREFIX + userId + '_' + key);
            }
        }

        async function cloudSet(userId, key, valueStr) {
            localStorage.setItem(LS_PREFIX + userId + '_' + key, valueStr);
            if (!cloudReady || !fbDb || !userId) return;
            try {
                await fbDb.collection('users').doc(userId).collection('data').doc(key).set({
                    value: valueStr,
                    updatedAt: Date.now(),
                    userId: userId
                });
            } catch (e) {
                console.warn('Error guardando en Firebase:', e);
            }
        }

        async function loadData(userId) {
            try {
                const l = await cloudGet(userId, 'licitaciones');
                S.licitaciones = l ? JSON.parse(l) : null;
            } catch (e) { S.licitaciones = null; }
            try {
                const c = await cloudGet(userId, 'contactos');
                S.contactos = c ? JSON.parse(c) : null;
            } catch (e) { S.contactos = null; }

            if (S.licitaciones === null) { S.licitaciones = []; await saveLicitaciones(userId); }
            if (S.contactos === null) { S.contactos = []; await saveContactos(userId); }

            // Logo
            const logo = document.getElementById('brand-stamp');
            const cfg = await cloudGet(userId, 'config');
            if (cfg) {
                try {
                    const config = JSON.parse(cfg);
                    if (config.logo) logo.innerHTML = `<img src="${config.logo}" alt="logo">`;
                } catch (e) {}
            }
        }

        async function saveLicitaciones(userId) { await cloudSet(userId || S.user?.uid, 'licitaciones', JSON.stringify(S.licitaciones)); }
        async function saveContactos(userId) { await cloudSet(userId || S.user?.uid, 'contactos', JSON.stringify(S.contactos)); }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window.__tt);
            window.__tt = setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ============================================================
        // FUNCIONES DE FILTRO Y ORDENAMIENTO
        // ============================================================
        function applyLicFiltersAndSort(data) {
            let result = [...data];
            if (S.licFilters.convocatoria) {
                const f = S.licFilters.convocatoria.toLowerCase().trim();
                result = result.filter(l => l.convocatoria && l.convocatoria.toLowerCase().includes(f));
            }
            if (S.licFilters.proyecto) {
                const f = S.licFilters.proyecto.toLowerCase().trim();
                result = result.filter(l => l.proyecto && l.proyecto.toLowerCase().includes(f));
            }
            if (S.licFilters.entidad) {
                const f = S.licFilters.entidad.toLowerCase().trim();
                result = result.filter(l => l.entidad && l.entidad.toLowerCase().includes(f));
            }
            if (S.licFilters.estado) {
                result = result.filter(l => l.estado === S.licFilters.estado);
            }
            if (S.licSort.column) {
                result.sort((a, b) => {
                    let valA = a[S.licSort.column] || '';
                    let valB = b[S.licSort.column] || '';
                    if (S.licSort.column === 'monto') {
                        valA = Number(valA) || 0;
                        valB = Number(valB) || 0;
                    }
                    if (typeof valA === 'string') valA = valA.toLowerCase();
                    if (typeof valB === 'string') valB = valB.toLowerCase();
                    if (valA < valB) return S.licSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return S.licSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });
            }
            return result;
        }

        function applyContFiltersAndSort(data) {
            let result = [...data];
            if (S.contFilters.nombre) {
                const f = S.contFilters.nombre.toLowerCase().trim();
                result = result.filter(c => c.nombre && c.nombre.toLowerCase().includes(f));
            }
            if (S.contFilters.empresa) {
                const f = S.contFilters.empresa.toLowerCase().trim();
                result = result.filter(c => c.empresa && c.empresa.toLowerCase().includes(f));
            }
            if (S.contFilters.cargo) {
                const f = S.contFilters.cargo.toLowerCase().trim();
                result = result.filter(c => c.cargo && c.cargo.toLowerCase().includes(f));
            }
            if (S.contSort.column) {
                result.sort((a, b) => {
                    let valA = a[S.contSort.column] || '';
                    let valB = b[S.contSort.column] || '';
                    if (typeof valA === 'string') valA = valA.toLowerCase();
                    if (typeof valB === 'string') valB = valB.toLowerCase();
                    if (valA < valB) return S.contSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return S.contSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });
            }
            return result;
        }

        function toggleLicSort(column) {
            if (S.licSort.column === column) {
                S.licSort.direction = S.licSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                S.licSort.column = column;
                S.licSort.direction = 'asc';
            }
            render();
        }

        function toggleContSort(column) {
            if (S.contSort.column === column) {
                S.contSort.direction = S.contSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                S.contSort.column = column;
                S.contSort.direction = 'asc';
            }
            render();
        }

        function clearLicFilters() {
            S.licFilters = { convocatoria: '', proyecto: '', estado: '', entidad: '' };
            S.licSort = { column: null, direction: 'asc' };
            document.querySelectorAll('.lic-filter-bar input, .lic-filter-bar select').forEach(el => {
                if (el.tagName === 'SELECT') el.value = '';
                else el.value = '';
            });
            render();
        }

        function clearContFilters() {
            S.contFilters = { nombre: '', empresa: '', cargo: '' };
            S.contSort = { column: null, direction: 'asc' };
            document.querySelectorAll('.cont-filter-bar input, .cont-filter-bar select').forEach(el => {
                if (el.tagName === 'SELECT') el.value = '';
                else el.value = '';
            });
            render();
        }

        // ============================================================
        // RENDER
        // ============================================================
        function render() {
            const nav = document.getElementById('nav');
            const items = [
                ['dashboard', 'Dashboard', 'dash'],
                ['licitaciones', 'Licitaciones', 'lic'],
                ['contactos', 'Contactos', 'contact']
            ];
            nav.innerHTML = items.map(([id, label, ic]) =>
                `<button class="nav-btn ${S.view === id ? 'active' : ''}" data-nav="${id}">${ICONS[ic]}<span>${label}</span></button>`
            ).join('');
            nav.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { S.view = b.dataset.nav;
                render(); });

            const main = document.getElementById('main');
            if (S.view === 'dashboard') main.innerHTML = viewDashboard();
            else if (S.view === 'licitaciones') main.innerHTML = viewLicitaciones();
            else if (S.view === 'contactos') main.innerHTML = viewContactos();

            bindAppEvents();
        }

        // ============================================================
        // VIEWS
        // ============================================================
        function viewDashboard() {
            const lic = S.licitaciones;
            const contactos = S.contactos;

            const total = lic.length;
            const adjudicadas = lic.filter(l => l.estado === 'adjudicada').length;
            const evaluacion = lic.filter(l => l.estado === 'evaluacion').length;
            const noAdjudicadas = lic.filter(l => l.estado === 'no-adjudicada').length;
            const enCurso = lic.filter(l => l.estado === 'en-curso').length;
            const presentadas = lic.filter(l => l.estado === 'presentada').length;

            const estados = [
                { label: 'Presentada', value: presentadas, color: '#5A5A5A' },
                { label: 'En evaluación', value: evaluacion, color: '#F39C12' },
                { label: 'Adjudicada', value: adjudicadas, color: '#27AE60' },
                { label: 'No adjudicada', value: noAdjudicadas, color: '#C0392B' },
                { label: 'En curso', value: enCurso, color: '#B8862E' }
            ];
            const maxVal = Math.max(1, ...estados.map(e => e.value));

            const montoTotal = lic.reduce((s, l) => s + (Number(l.monto) || 0), 0);

            return `
            <div class="page-head">
                <div><p class="eyebrow">Panel general</p><h1>Dashboard</h1><p>Resumen de licitaciones y contactos.</p></div>
            </div>

            <div class="kpi-grid">
                <div class="kpi"><div class="label">Total propuestas</div><div class="val">${total}</div><div class="sub">${contactos.length} contactos</div></div>
                <div class="kpi success"><div class="label">Adjudicadas</div><div class="val">${adjudicadas}</div><div class="sub">${total > 0 ? Math.round(adjudicadas/total*100) : 0}% del total</div></div>
                <div class="kpi accent"><div class="label">En evaluación</div><div class="val">${evaluacion}</div><div class="sub">${total > 0 ? Math.round(evaluacion/total*100) : 0}% del total</div></div>
                <div class="kpi danger"><div class="label">No adjudicadas</div><div class="val">${noAdjudicadas}</div><div class="sub">${total > 0 ? Math.round(noAdjudicadas/total*100) : 0}% del total</div></div>
                <div class="kpi"><div class="label">Monto total</div><div class="val">${bs(montoTotal)}</div><div class="sub">${lic.length} propuestas</div></div>
            </div>

            <div class="panel" style="margin-bottom:20px;">
                <div class="panel-h"><h3>📊 Distribución por estado</h3></div>
                <div class="panel-body">
                    ${estados.map(e => `
                        <div class="chart-bar-row">
                            <span class="label">${e.label}</span>
                            <div class="track">
                                <div class="fill" style="width:${(e.value/maxVal*100)||0}%;background:${e.color};"></div>
                            </div>
                            <span class="value">${e.value}</span>
                        </div>
                    `).join('')}
                </div>
            </div>

            <div class="panel">
                <div class="panel-h"><h3>📋 Últimas licitaciones</h3></div>
                <div class="panel-body">
                    ${lic.length ? lic.slice(0, 5).map(l => `
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
                            <div>
                                <div style="font-weight:600;">${esc(l.proyecto)}</div>
                                <div style="font-size:12px;color:var(--text-soft);">${esc(l.entidad)} · ${fmtDate(l.fecha)}</div>
                            </div>
                            <div style="display:flex;align-items:center;gap:12px;">
                                <span class="stamp ${l.estado}">${l.estado}</span>
                                ${l.monto ? `<span style="font-size:12px;font-weight:500;">${bs(l.monto)}</span>` : ''}
                            </div>
                        </div>
                    `).join('') : `<div class="empty">${ICONS.empty}<div>Sin licitaciones registradas aún.</div></div>`}
                </div>
            </div>`;
        }

        function viewLicitaciones() {
            const rows = applyLicFiltersAndSort(S.licitaciones);
            const estados = ['presentada', 'evaluacion', 'adjudicada', 'no-adjudicada', 'en-curso'];

            return `
            <div class="page-head">
                <div><p class="eyebrow">Propuestas</p><h1>Licitaciones</h1><p>Registro de propuestas presentadas.</p></div>
                <div class="page-actions">
                    <button class="btn btn-success" id="btn-export-lic-excel">${ICONS.excel} Exportar Excel</button>
                    <button class="btn btn-primary" id="btn-new-lic">${ICONS.plus} Nueva licitación</button>
                </div>
            </div>
            <div class="panel">
                <div class="panel-body">
                    <div class="filter-bar lic-filter-bar">

                        <input id="lic-filter-convocatoria" placeholder="Convocatoria..." value="${S.licFilters.convocatoria}">
                        <input id="lic-filter-proyecto" placeholder="Proyecto..." value="${S.licFilters.proyecto}">
                        <input id="lic-filter-entidad" placeholder="Entidad..." value="${S.licFilters.entidad}">

                                <th onclick="toggleLicSort('proyecto')" class="${S.licSort.column === 'proyecto' ? 'active' : ''}">Proyecto <span class="sort-icon">${S.licSort.column === 'proyecto' ? (S.licSort.direction === 'asc' ? '▲' : '▼') : '⇅'}</span></th>
                                <th onclick="toggleLicSort('entidad')" class="${S.licSort.column === 'entidad' ? 'active' : ''}">Entidad <span class="sort-icon">${S.licSort.column === 'entidad' ? (S.licSort.direction === 'asc' ? '▲' : '▼') : '⇅'}</span></th>
                                <th onclick="toggleLicSort('fecha')" class="${S.licSort.column === 'fecha' ? 'active' : ''}">Fecha <span class="sort-icon">${S.licSort.column === 'fecha' ? (S.licSort.direction === 'asc' ? '▲' : '▼') : '⇅'}</span></th>
                                <th onclick="toggleLicSort('monto')" class="${S.licSort.column === 'monto' ? 'active' : ''}" class="tright">Monto <span class="sort-icon">${S.licSort.column === 'monto' ? (S.licSort.direction === 'asc' ? '▲' : '▼') : '⇅'}</span></th>
                                <th onclick="toggleLicSort('estado')" class="${S.licSort.column === 'estado' ? 'active' : ''}">Estado <span class="sort-icon">${S.licSort.column === 'estado' ? (S.licSort.direction === 'asc' ? '▲' : '▼') : '⇅'}</span></th>
                                <th>Contacto</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows.map(l => {

                                return `<tr>
                                    <td>${esc(l.convocatoria)}</td>
                                    <td style="font-weight:500;">${esc(l.proyecto)}</td>

                                    <td class="tright tnum">${l.monto ? bs(l.monto) : '—'}</td>

                                    <td>${contacto ? esc(contacto.nombre) : '—'}</td>
                                    <td>
                                        <div class="rowactions">
                                            <button class="iconbtn" title="Editar" data-edit-lic="${l.id}">${ICONS.edit}</button>
                                            <button class="iconbtn" title="Eliminar" data-del-lic="${l.id}">${ICONS.trash}</button>
                                        </div>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table></div>` : `<div class="empty">${ICONS.empty}<div>Sin licitaciones que coincidan con los filtros.</div></div>`}
                </div>
            </div>`;
        }

        function viewContactos() {
            const rows = applyContFiltersAndSort(S.contactos);

            return `
            <div class="page-head">
                <div><p class="eyebrow">Contactos</p><h1>Contactos</h1><p>Personas a quienes firmas propuestas.</p></div>
                <div class="page-actions">
                    <button class="btn btn-success" id="btn-export-cont-excel">${ICONS.excel} Exportar Excel</button>
                    <button class="btn btn-primary" id="btn-new-cont">${ICONS.plus} Nuevo contacto</button>
                </div>
            </div>
            <div class="panel">
                <div class="panel-body">
                    <div class="filter-bar cont-filter-bar">
                        <label>🔍 Filtros:</label>
                        <input id="cont-filter-nombre" placeholder="Nombre..." value="${S.contFilters.nombre}">
                        <input id="cont-filter-empresa" placeholder="Empresa..." value="${S.contFilters.empresa}">
                        <input id="cont-filter-cargo" placeholder="Cargo..." value="${S.contFilters.cargo}">
                        <button class="btn btn-sm btn-ghost" id="cont-filter-apply">Aplicar</button>
                        <span class="filter-clear" id="cont-filter-clear">Limpiar</span>
                    </div>
                    ${rows.length ? `<div class="table-wrap"><table>
                        <thead>
                            <tr>
                                <th onclick="toggleContSort('nombre')" class="${S.contSort.column === 'nombre' ? 'active' : ''}">Nombre <span class="sort-icon">${S.contSort.column === 'nombre' ? (S.contSort.direction === 'asc' ? '▲' : '▼') : '⇅'}</span></th>
                                <th onclick="toggleContSort('empresa')" class="${S.contSort.column === 'empresa' ? 'active' : ''}">Empresa <span class="sort-icon">${S.contSort.column === 'empresa' ? (S.contSort.direction === 'asc' ? '▲' : '▼') : '⇅'}</span></th>
                                <th onclick="toggleContSort('cargo')" class="${S.contSort.column === 'cargo' ? 'active' : ''}">Cargo <span class="sort-icon">${S.contSort.column === 'cargo' ? (S.contSort.direction === 'asc' ? '▲' : '▼') : '⇅'}</span></th>
                                <th onclick="toggleContSort('telefono')" class="${S.contSort.column === 'telefono' ? 'active' : ''}">Teléfono <span class="sort-icon">${S.contSort.column === 'telefono' ? (S.contSort.direction === 'asc' ? '▲' : '▼') : '⇅'}</span></th>
                                <th onclick="toggleContSort('email')" class="${S.contSort.column === 'email' ? 'active' : ''}">Correo <span class="sort-icon">${S.contSort.column === 'email' ? (S.contSort.direction === 'asc' ? '▲' : '▼') : '⇅'}</span></th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows.map(c => `
                                <tr>
                                    <td style="font-weight:500;">${esc(c.nombre)}</td>
                                    <td>${esc(c.empresa)}</td>
                                    <td>${esc(c.cargo)}</td>
                                    <td>${esc(c.telefono)}</td>
                                    <td>${esc(c.email)}</td>
                                    <td>
                                        <div class="rowactions">
                                            <button class="iconbtn" title="Editar" data-edit-cont="${c.id}">${ICONS.edit}</button>
                                            <button class="iconbtn" title="Eliminar" data-del-cont="${c.id}">${ICONS.trash}</button>
                                        </div>
                                    </td>
                                </tr>`).join('')}
                        </tbody>
                    </table></div>` : `<div class="empty">${ICONS.empty}<div>Sin contactos registrados.</div></div>`}
                </div>
            </div>`;
        }

        // ============================================================
        // MODALES
        // ============================================================
        function openLicModal(lic) {
            const isNew = !lic;
            const l = lic ? { ...lic } : {
                id: uid(),
                convocatoria: '',
                proyecto: '',
                entidad: '',
                fecha: new Date().toISOString().slice(0, 10),
                estado: 'presentada',
                contactoId: '',
                monto: '',
                observaciones: ''
            };

            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="modal" style="max-width:640px;">
                    <div class="modal-h">
                        <h3>${isNew ? 'Nueva licitación' : 'Editar licitación'}</h3>
                        <button class="close" id="m-close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="field"><label>N° Convocatoria</label><input id="lic-convocatoria" value="${attr(l.convocatoria)}" placeholder="Ej. LIC-2024-001"></div>
                        <div class="field"><label>Proyecto</label><input id="lic-proyecto" value="${attr(l.proyecto)}" placeholder="Nombre del proyecto"></div>
                        <div class="field"><label>Entidad convocante</label><input id="lic-entidad" value="${attr(l.entidad)}" placeholder="Nombre de la entidad"></div>
                        <div class="row2">
                            <div class="field"><label>Fecha de presentación</label><input type="date" id="lic-fecha" value="${attr(l.fecha)}"></div>
                            <div class="field"><label>Monto [Bs]</label><input type="number" step="0.01" id="lic-monto" value="${l.monto || ''}" placeholder="0.00"></div>
                        </div>
                        <div class="field">
                            <label>Estado</label>
                            <select id="lic-estado">
                                ${['presentada','evaluacion','adjudicada','no-adjudicada','en-curso'].map(e =>
                                    `<option value="${e}" ${l.estado === e ? 'selected' : ''}>${e}</option>`
                                ).join('')}
                            </select>
                        </div>
                        <div class="field">
                            <label>Contacto asociado</label>
                            <select id="lic-contacto">
                                <option value="">Seleccionar contacto...</option>
                                ${S.contactos.map(c =>
                                    `<option value="${c.id}" ${l.contactoId === c.id ? 'selected' : ''}>${esc(c.nombre)} - ${esc(c.empresa)}</option>`
                                ).join('')}
                            </select>
                        </div>
                        <div class="field"><label>Observaciones</label><textarea id="lic-observaciones" rows="3">${esc(l.observaciones||'')}</textarea></div>
                    </div>
                    <div class="modal-foot">
                        <button class="btn btn-ghost" id="m-cancel">Cancelar</button>
                        <button class="btn btn-primary" id="m-save">${isNew ? 'Guardar' : 'Actualizar'}</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const closeModal = () => {
                if (overlay && overlay.parentNode) overlay.remove();
            };

            overlay.querySelector('#m-close').onclick = closeModal;
            overlay.querySelector('#m-cancel').onclick = closeModal;
            overlay.addEventListener('mousedown', e => { if (e.target === overlay) closeModal(); });

            overlay.querySelector('#m-save').onclick = async () => {
                const nuevo = {
                    id: l.id,
                    convocatoria: document.getElementById('lic-convocatoria').value.trim(),
                    proyecto: document.getElementById('lic-proyecto').value.trim(),
                    entidad: document.getElementById('lic-entidad').value.trim(),
                    fecha: document.getElementById('lic-fecha').value,
                    estado: document.getElementById('lic-estado').value,
                    contactoId: document.getElementById('lic-contacto').value,
                    monto: Number(document.getElementById('lic-monto').value) || 0,
                    observaciones: document.getElementById('lic-observaciones').value.trim()
                };
                if (!nuevo.proyecto) { toast('Ingresa el nombre del proyecto.'); return; }
                if (isNew) S.licitaciones.push(nuevo);
                else S.licitaciones = S.licitaciones.map(x => x.id === nuevo.id ? nuevo : x);
                await saveLicitaciones(S.user?.uid);
                closeModal();
                render();
                toast(isNew ? '✅ Licitación registrada.' : '✅ Licitación actualizada.');
            };
        }

        function openContModal(cont) {
            const isNew = !cont;
            const c = cont ? { ...cont } : {
                id: uid(),
                nombre: '',
                empresa: '',
                cargo: '',
                telefono: '',
                email: '',
                notas: ''
            };

            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="modal" style="max-width:600px;">
                    <div class="modal-h">
                        <h3>${isNew ? 'Nuevo contacto' : 'Editar contacto'}</h3>
                        <button class="close" id="m-close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="field"><label>Nombre completo</label><input id="cont-nombre" value="${attr(c.nombre)}" placeholder="Nombre y apellido"></div>
                        <div class="row2">
                            <div class="field"><label>Empresa / Institución</label><input id="cont-empresa" value="${attr(c.empresa)}" placeholder="Empresa"></div>
                            <div class="field"><label>Cargo</label><input id="cont-cargo" value="${attr(c.cargo)}" placeholder="Cargo"></div>
                        </div>
                        <div class="row2">
                            <div class="field"><label>Teléfono</label><input id="cont-telefono" value="${attr(c.telefono)}" placeholder="Número de teléfono"></div>
                            <div class="field"><label>Correo electrónico</label><input id="cont-email" value="${attr(c.email)}" placeholder="correo@ejemplo.com"></div>
                        </div>
                        <div class="field"><label>Notas adicionales</label><textarea id="cont-notas" rows="3">${esc(c.notas||'')}</textarea></div>
                    </div>
                    <div class="modal-foot">
                        <button class="btn btn-ghost" id="m-cancel">Cancelar</button>
                        <button class="btn btn-primary" id="m-save">${isNew ? 'Guardar' : 'Actualizar'}</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const closeModal = () => {
                if (overlay && overlay.parentNode) overlay.remove();
            };

            overlay.querySelector('#m-close').onclick = closeModal;
            overlay.querySelector('#m-cancel').onclick = closeModal;
            overlay.addEventListener('mousedown', e => { if (e.target === overlay) closeModal(); });

            overlay.querySelector('#m-save').onclick = async () => {
                const nuevo = {
                    id: c.id,
                    nombre: document.getElementById('cont-nombre').value.trim(),
                    empresa: document.getElementById('cont-empresa').value.trim(),
                    cargo: document.getElementById('cont-cargo').value.trim(),
                    telefono: document.getElementById('cont-telefono').value.trim(),
                    email: document.getElementById('cont-email').value.trim(),
                    notas: document.getElementById('cont-notas').value.trim()
                };
                if (!nuevo.nombre) { toast('Ingresa el nombre del contacto.'); return; }
                if (isNew) S.contactos.push(nuevo);
                else S.contactos = S.contactos.map(x => x.id === nuevo.id ? nuevo : x);
                await saveContactos(S.user?.uid);
                closeModal();
                render();
                toast(isNew ? '✅ Contacto registrado.' : '✅ Contacto actualizado.');
            };
        }

        // ============================================================
        // EXPORTAR EXCEL
        // ============================================================
        function exportLicitacionesExcel() {
            if (!S.licitaciones.length) { toast('No hay licitaciones para exportar.'); return; }
            const data = S.licitaciones.map(l => ({
                'Convocatoria': l.convocatoria || '',
                'Proyecto': l.proyecto || '',
                'Entidad': l.entidad || '',
                'Fecha': fmtDateExcel(l.fecha),
                'Estado': l.estado || '',
                'Monto (Bs)': Number(l.monto || 0),
                'Observaciones': l.observaciones || ''
            }));
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, 'Licitaciones');
            XLSX.writeFile(wb, `Licitaciones_Ing_Antequera_${new Date().toISOString().slice(0,10)}.xlsx`);
            toast('✅ Excel exportado.');
        }

        function exportContactosExcel() {
            if (!S.contactos.length) { toast('No hay contactos para exportar.'); return; }
            const data = S.contactos.map(c => ({
                'Nombre': c.nombre || '',
                'Empresa': c.empresa || '',
                'Cargo': c.cargo || '',
                'Teléfono': c.telefono || '',
                'Correo': c.email || '',
                'Notas': c.notas || ''
            }));
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, 'Contactos');
            XLSX.writeFile(wb, `Contactos_Ing_Antequera_${new Date().toISOString().slice(0,10)}.xlsx`);
            toast('✅ Excel exportado.');
        }

        function fmtDateExcel(s) {
            if (!s) return '';
            const d = new Date(s + 'T00:00:00');
            return isNaN(d) ? s : d.toLocaleDateString('es-BO', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        // ============================================================
        // LOGIN EVENTS
        // ============================================================
        function initLoginEvents() {
            document.getElementById('login-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                if (!email || !password) { showLoginError('Completa todos los campos.'); return; }
                const btn = document.getElementById('btn-login');
                btn.disabled = true;
                btn.textContent = 'Iniciando sesión...';
                try { await login(email, password); } finally { btn.disabled = false;
                    btn.textContent = 'Iniciar sesión'; }
            });

            document.getElementById('register-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('register-email').value.trim();
                const password = document.getElementById('register-password').value;
                if (!email || !password) { showLoginError('Completa todos los campos.'); return; }
                if (password.length < 6) { showLoginError('La contraseña debe tener al menos 6 caracteres.'); return; }
                const btn = document.getElementById('btn-register');
                btn.disabled = true;
                btn.textContent = 'Creando cuenta...';
                try { await register(email, password); } finally { btn.disabled = false;
                    btn.textContent = 'Crear cuenta'; }
            });

            document.getElementById('reset-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('reset-email').value.trim();
                if (!email) { showLoginError('Ingresa tu correo electrónico.'); return; }
                const btn = document.getElementById('btn-reset');
                btn.disabled = true;
                btn.textContent = 'Enviando...';
                try { await resetPassword(email); } finally { btn.disabled = false;
                    btn.textContent = 'Enviar correo de recuperación'; }
            });

            document.getElementById('goto-register').onclick = () => {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
                document.getElementById('reset-form').style.display = 'none';
                hideLoginError();
            };
            document.getElementById('goto-login').onclick = () => {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
                document.getElementById('reset-form').style.display = 'none';
                hideLoginError();
            };
            document.getElementById('goto-login-reset').onclick = () => {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
                document.getElementById('reset-form').style.display = 'none';
                hideLoginError();
            };
            document.getElementById('goto-reset').onclick = () => {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'none';
                document.getElementById('reset-form').style.display = 'block';
                hideLoginError();
            };
        }

        // ============================================================
        // APP EVENTS
        // ============================================================
        function bindAppEvents() {
            const main = document.getElementById('main');

            document.getElementById('btn-logout').onclick = logout;

            // Licitaciones
            const btnNewLic = document.getElementById('btn-new-lic');
            if (btnNewLic) btnNewLic.onclick = () => openLicModal(null);
            main.querySelectorAll('[data-edit-lic]').forEach(b => b.onclick = () => openLicModal(S.licitaciones.find(l => l.id === b.dataset.editLic)));
            main.querySelectorAll('[data-del-lic]').forEach(b => b.onclick = async () => {
                if (!confirm('¿Eliminar esta licitación?')) return;
                S.licitaciones = S.licitaciones.filter(l => l.id !== b.dataset.delLic);
                await saveLicitaciones(S.user?.uid);
                render();
                toast('Licitación eliminada.');
            });
            const btnExpLic = document.getElementById('btn-export-lic-excel');
            if (btnExpLic) btnExpLic.onclick = exportLicitacionesExcel;

            // Contactos
            const btnNewCont = document.getElementById('btn-new-cont');
            if (btnNewCont) btnNewCont.onclick = () => openContModal(null);
            main.querySelectorAll('[data-edit-cont]').forEach(b => b.onclick = () => openContModal(S.contactos.find(c => c.id === b.dataset.editCont)));
            main.querySelectorAll('[data-del-cont]').forEach(b => b.onclick = async () => {
                if (!confirm('¿Eliminar este contacto?')) return;
                S.contactos = S.contactos.filter(c => c.id !== b.dataset.delCont);
                await saveContactos(S.user?.uid);
                render();
                toast('Contacto eliminado.');
            });
            const btnExpCont = document.getElementById('btn-export-cont-excel');
            if (btnExpCont) btnExpCont.onclick = exportContactosExcel;

            // Filtros - Licitaciones
            const licFilterApply = document.getElementById('lic-filter-apply');
            if (licFilterApply) {
                licFilterApply.onclick = () => {
                    S.licFilters.convocatoria = document.getElementById('lic-filter-convocatoria').value || '';
                    S.licFilters.proyecto = document.getElementById('lic-filter-proyecto').value || '';
                    S.licFilters.entidad = document.getElementById('lic-filter-entidad').value || '';
                    S.licFilters.estado = document.getElementById('lic-filter-estado').value || '';
                    render();
                    toast('🔍 Filtros aplicados');
                };
            }
            const licFilterClear = document.getElementById('lic-filter-clear');
            if (licFilterClear) licFilterClear.onclick = clearLicFilters;

            // Filtros - Contactos
            const contFilterApply = document.getElementById('cont-filter-apply');
            if (contFilterApply) {
                contFilterApply.onclick = () => {
                    S.contFilters.nombre = document.getElementById('cont-filter-nombre').value || '';
                    S.contFilters.empresa = document.getElementById('cont-filter-empresa').value || '';
                    S.contFilters.cargo = document.getElementById('cont-filter-cargo').value || '';
                    render();
                    toast('🔍 Filtros aplicados');
                };
            }
            const contFilterClear = document.getElementById('cont-filter-clear');
            if (contFilterClear) contFilterClear.onclick = clearContFilters;

            // Enter en filtros
            document.querySelectorAll('.filter-bar input').forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const applyBtn = input.closest('.filter-bar').querySelector('.filter-apply, [id$="-filter-apply"]');
                        if (applyBtn) applyBtn.click();
                    }
                });
            });
        }

        // ============================================================
        // INICIO
        // ============================================================
        window.toggleLicSort = toggleLicSort;
        window.toggleContSort = toggleContSort;
        window.clearLicFilters = clearLicFilters;
        window.clearContFilters = clearContFilters;

        initLoginEvents();
        initFirebase();
    </script>
</body>
</html>
