<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ing. Antequera — Suite Profesional</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/tu-usuario/tu-repo/main/favicon.ico">
    
    <!-- Librerías -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F2F0EB;
            --surface: #FFFFFF;
            --surface-hover: #F8F7F4;
            --border: #D9D6CE;
            --text: #1E1E1E;
            --text-soft: #5A5A5A;
            --primary: #1A4A5C;
            --primary-light: #3A7A8F;
            --accent: #B8862E;
            --accent-light: #D4A854;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
            --transition: 0.2s ease;
            --gantt-bg: #F0F2F5;
            --gantt-bar: #1A4A5C;
            --gantt-bar-light: #3A7A8F;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }
        ::selection { background: var(--accent); color: #fff; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        #sidebar {
            width: 240px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 8px;
            overflow-y: auto;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .brand-stamp {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            overflow: hidden;
            flex-shrink: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--primary);
        }
        .brand-stamp img { width: 100%; height: 100%; object-fit: cover; }
        .brand-txt .t1 { font-weight: 700; font-size: 14px; line-height: 1.2; color: var(--primary); }
        .brand-txt .t2 { font-size: 11px; color: var(--text-soft); }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius);
            border: none;
            background: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-soft);
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: var(--transition);
        }
        .nav-btn:hover { background: var(--surface-hover); color: var(--text); }
        .nav-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(26,74,92,0.2);
        }
        .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
        .nav-foot {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 10.5px;
            color: var(--text-soft);
        }
        .nav-user {
            padding: 12px 12px 8px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-soft);
        }
        .nav-user .email { font-weight: 500; color: var(--text); word-break: break-all; }
        .nav-user .logout-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 11px;
            cursor: pointer;
            color: var(--text-soft);
            margin-top: 6px;
            transition: var(--transition);
        }
        .nav-user .logout-btn:hover { background: #FDF2F0; border-color: #C0392B; color: #C0392B; }

        main {
            flex: 1;
            padding: 32px 40px 60px;
            max-width: 1300px;
            overflow-y: auto;
            height: 100vh;
        }
        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .page-head h1 { font-size: 24px; font-weight: 700; color: var(--primary); margin: 0 0 4px; }
        .page-head p { color: var(--text-soft); font-size: 14px; margin: 0; }
        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0 0 4px;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            padding: 9px 18px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:hover { background: var(--accent-light); }
        .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
        .btn-ghost:hover { background: var(--surface-hover); }
        .btn-danger { background: transparent; color: #C0392B; border-color: #F5D6D3; }
        .btn-danger:hover { background: #FDF2F0; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-success { background: #27AE60; color: #fff; }
        .btn-success:hover { background: #219A52; }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
            background: var(--bg);
        }
        .login-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 36px;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }
        .login-box h2 { font-size: 22px; color: var(--primary); margin-bottom: 8px; }
        .login-box .sub { color: var(--text-soft); font-size: 14px; margin-bottom: 24px; }
        .login-box .field { margin-bottom: 16px; }
        .login-box .field label { font-size: 12px; font-weight: 500; color: var(--text); display: block; margin-bottom: 4px; }
        .login-box .field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            transition: var(--transition);
        }
        .login-box .field input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,74,92,0.1);
        }
        .login-box .btn { width: 100%; justify-content: center; margin-top: 4px; }
        .login-box .toggle-link {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-soft);
        }
        .login-box .toggle-link a {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .login-box .toggle-link a:hover { text-decoration: underline; }
        .login-box .error {
            color: #C0392B;
            font-size: 13px;
            padding: 8px 12px;
            background: #FDF2F0;
            border-radius: var(--radius);
            margin-bottom: 12px;
            display: none;
        }
        .login-box .error.show { display: block; }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .panel + .panel { margin-top: 20px; }
        .panel-h {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-h h3 { font-size: 15px; font-weight: 600; color: var(--primary); margin: 0; }
        .panel-body { padding: 18px 20px; }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .kpi {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            position: relative;
            overflow: hidden;
        }
        .kpi::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
        }
        .kpi.accent::before { background: var(--accent); }
        .kpi.success::before { background: #27AE60; }
        .kpi.danger::before { background: #C0392B; }
        .kpi .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 6px; }
        .kpi .val { font-size: 24px; font-weight: 700; color: var(--primary); }
        .kpi .sub { font-size: 12px; color: var(--text-soft); margin-top: 4px; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-soft);
            padding: 10px 14px;
            border-bottom: 1.5px solid var(--border);
            font-weight: 600;
        }
        td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: var(--surface-hover); }
        .tnum { font-family: 'JetBrains Mono', monospace; }
        .tright { text-align: right; }

        .rowactions { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
        .iconbtn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 7px;
            cursor: pointer;
            color: var(--text-soft);
            display: inline-flex;
            transition: var(--transition);
        }
        .iconbtn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
        .iconbtn svg { width: 14px; height: 14px; }

        .stamp {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1.5px solid currentColor;
        }
        .stamp.borrador { color: var(--text-soft); background: #F0EFEB; }
        .stamp.enviada { color: var(--accent); background: #F5ECD9; }
        .stamp.aceptada { color: #27AE60; background: #E8F5ED; }
        .stamp.rechazada { color: #C0392B; background: #FDF2F0; }
        .stamp.pendiente { color: #C0392B; background: #FDF2F0; }
        .stamp.parcial { color: var(--accent); background: #F5ECD9; }
        .stamp.pagado { color: #27AE60; background: #E8F5ED; }

        .empty { padding: 40px 20px; text-align: center; color: var(--text-soft); }
        .empty svg { width: 40px; height: 40px; opacity: 0.3; margin-bottom: 12px; }

        .gantt-container {
            background: var(--gantt-bg);
            border-radius: var(--radius);
            padding: 16px;
            overflow-x: auto;
        }
        .gantt-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .gantt-row:last-child { border-bottom: none; }
        .gantt-label {
            width: 200px;
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 500;
            color: var(--text);
        }
        .gantt-track {
            flex: 1;
            height: 28px;
            background: rgba(255,255,255,0.5);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        .gantt-bar {
            height: 100%;
            border-radius: 4px;
            background: var(--gantt-bar);
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 6px;
            transition: width 0.3s ease;
        }
        .gantt-bar.light { background: var(--gantt-bar-light); }
        .gantt-duration {
            font-size: 11px;
            color: var(--text-soft);
            width: 60px;
            flex-shrink: 0;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
        }
        .gantt-legend {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .gantt-legend span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-soft);
        }
        .gantt-legend .dot {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            display: inline-block;
        }
        .gantt-legend .dot.primary { background: var(--gantt-bar); }
        .gantt-legend .dot.light { background: var(--gantt-bar-light); }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px;
            overflow-y: auto;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 720px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }
        .modal-h {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-h h3 { font-size: 17px; font-weight: 600; color: var(--primary); margin: 0; }
        .modal-h .close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-soft); padding: 0 4px; }
        .modal-body { padding: 22px 24px; max-height: 70vh; overflow-y: auto; }
        .modal-foot {
            padding: 14px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-soft);
            margin-bottom: 5px;
            font-weight: 500;
        }
        .field input, .field textarea, .field select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            background: #fff;
            color: var(--text);
            transition: var(--transition);
        }
        .field input:focus, .field textarea:focus, .field select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,74,92,0.1);
        }
        .field textarea { resize: vertical; min-height: 60px; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--primary);
            color: #fff;
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 13px;
            box-shadow: var(--shadow-lg);
            z-index: 200;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.25s ease;
            pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            #sidebar { width: 64px; padding: 16px 8px; }
            .brand-txt { display: none; }
            .nav-btn span { display: none; }
            .nav-btn { justify-content: center; padding: 10px; }
            .nav-foot { display: none; }
            .nav-user { display: none; }
            main { padding: 20px 16px; }
            .row2, .row3 { grid-template-columns: 1fr; }
            .gantt-label { width: 100px; font-size: 11px; }
            .page-head { flex-direction: column; }
            .login-box { padding: 28px 20px; }
        }
        @media (max-width: 480px) {
            .kpi-grid { grid-template-columns: 1fr 1fr; }
            .gantt-label { width: 80px; }
            .gantt-duration { width: 40px; font-size: 10px; }
        }
        #app-container { display: none; width: 100%; }
        #login-container { display: none; }
    </style>
</head>
<body>
    <div id="login-container" class="login-container">
        <div class="login-box">
            <h2>Ing. Antequera</h2>
            <p class="sub">Inicia sesión para acceder a tu suite profesional</p>
            <div id="login-error" class="error"></div>
            
            <div id="login-form">
                <div class="field">
                    <label>Correo electrónico</label>
                    <input type="email" id="login-email" placeholder="tu@email.com">
                </div>
                <div class="field">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" id="btn-login">Iniciar sesión</button>
                <div class="toggle-link">
                    ¿No tienes cuenta? <a id="goto-register">Regístrate aquí</a>
                </div>
            </div>

            <div id="register-form" style="display:none;">
                <div class="field">
                    <label>Correo electrónico</label>
                    <input type="email" id="register-email" placeholder="tu@email.com">
                </div>
                <div class="field">
                    <label>Contraseña</label>
                    <input type="password" id="register-password" placeholder="•••••••• (mínimo 6 caracteres)">
                </div>
                <button class="btn btn-primary" id="btn-register">Crear cuenta</button>
                <div class="toggle-link">
                    ¿Ya tienes cuenta? <a id="goto-login">Inicia sesión aquí</a>
                </div>
            </div>
        </div>
    </div>

    <div id="app-container">
        <aside id="sidebar">
            <div class="brand">
                <div class="brand-stamp" id="brand-stamp">CAE</div>
                <div class="brand-txt">
                    <div class="t1">Ing. Antequera</div>
                    <div class="t2">Hidráulica · Hidrología</div>
                </div>
            </div>
            <nav id="nav"></nav>
            <div class="nav-user">
                <div class="email" id="user-email">usuario@email.com</div>
                <button class="logout-btn" id="btn-logout">Cerrar sesión</button>
            </div>
            <div class="nav-foot mono">RNI 28.106 · v2.0</div>
        </aside>
        <main id="main"></main>
    </div>

    <div id="toast"></div>

    <script>
        /* ============================================================
           CONFIGURACIÓN - DATOS DEL PROFESIONAL
           ============================================================ */
        const LOGO_URL = "https://raw.githubusercontent.com/tu-usuario/tu-repo/main/logo.png";
        
        // Datos personales para la hoja de vida
        const DATOS_PERSONALES = {

        // Formación académica
        const FORMACION_ACADEMICA = [

            { institucion: 'Universidad San Sebastián Chile', desde: '2014-05-01', hasta: '2014-10-01', grado: 'DIPLOMADO: Diseño en Ingeniería Hidráulica', titulo: '2014-10-01' },

            { institucion: 'Universidad Mayor Real y Pontificia de San Francisco Xavier de Chuquisaca', desde: '2017-07-01', hasta: '2018-12-01', grado: 'MAESTRÍA: en ingeniería Hidráulica', titulo: '2023-08-21' }

        // Cursos de especialización
        const CURSOS_ESPECIALIZACION = [

        function getSavedFirebaseConfig() {

        async function initFirebase() {
            const cfg = getSavedFirebaseConfig();
            if (!cfg) {
                document.getElementById('login-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
                showLoginError('Configura Firebase primero (ve a la sección Configuración después de iniciar sesión).');
                return;
            }
            try {
                fbApp = firebase.initializeApp(cfg);
                fbAuth = firebase.auth();
                fbDb = firebase.firestore();
                cloudReady = true;

                fbAuth.onAuthStateChanged(async (user) => {
                    S.user = user;
                    if (user) {
                        document.getElementById('login-container').style.display = 'none';
                        document.getElementById('app-container').style.display = 'flex';
                        document.getElementById('user-email').textContent = user.email || 'usuario@email.com';
                        await loadData();
                        render();
                    } else {
                        document.getElementById('login-container').style.display = 'flex';
                        document.getElementById('app-container').style.display = 'none';
                    }
                });

            } catch (e) {
                console.error('Firebase init failed', e);
                document.getElementById('login-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
                showLoginError('Error al conectar con Firebase. Verifica tu configuración.');
            }
        }

            }

            } catch (e) {
                showLoginError(e.message);
                return false;
            }

        function showLoginError(msg) {

        function hideLoginError() {
            document.getElementById('login-error').classList.remove('show');
        }

        async function cloudGet(key) {
            if (!cloudReady || !fbDb) return localStorage.getItem(LS_PREFIX + key);
            try {
                const snap = await fbDb.collection('appdata').doc(key).get();
                return snap.exists ? snap.data().value : null;
            } catch (e) {
                return localStorage.getItem(LS_PREFIX + key);
            }
        }

        async function cloudSet(key, valueStr) {
            localStorage.setItem(LS_PREFIX + key, valueStr);
            if (!cloudReady || !fbDb) return;
            try {
                await fbDb.collection('appdata').doc(key).set({ 
                    value: valueStr, 
                    updatedAt: Date.now(), 
                    userId: S.user?.uid || 'anonymous' 
                });
            } catch (e) { /* silencio */ }
        }

        function connectFirebase(configObj) {
            localStorage.setItem('hidro_firebase_config', JSON.stringify(configObj));

            try { const e = await cloudGet('experiencia'); S.experiencia = e ? JSON.parse(e) : null; } catch (e) { S.experiencia = null; }
            try { const cfg = await cloudGet('config'); if (cfg) S.config = { ...DEFAULT_CONFIG, ...JSON.parse(cfg) }; } catch (e) {}

            if (S.cotizaciones === null) { S.cotizaciones = seedCotizaciones(); await saveCotizaciones(); }
            if (S.pagos === null) { S.pagos = seedPagos(); await savePagos(); }
            if (S.clientes === null) { S.clientes = seedClientes(); await saveClientes(); }
            if (S.experiencia === null) { S.experiencia = seedExperiencia(); await saveExperiencia(); }

            if (S.config.logo) {
                document.getElementById('brand-stamp').innerHTML = `<img src="${S.config.logo}" alt="logo">`;
            }
        }

        async function saveCotizaciones() { await cloudSet('cotizaciones', JSON.stringify(S.cotizaciones)); }

        /* ============================================================
           HELPERS
           ============================================================ */
        function cotSubtotal(c) { return c.items.reduce((s, it) => s + (Number(it.pu) || 0) * (Number(it.cantidad) || 0), 0); }
        function cotTotal(c) { return cotSubtotal(c) - (Number(c.descuento) || 0); }
        function pagoEstado(p) { const pend = Number(p.monto) - Number(p.montoPagado || 0); if (pend <= 0.001) return 'pagado'; if (Number(p.montoPagado || 0) > 0) return 'parcial'; return 'pendiente'; }
        function esc(s) { return String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
        function attr(s) { return esc(s).replace(/"/g, '&quot;'); }

        const ICONS = {
            dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',

            exp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 22v-4M4 12H2h2M22 12h-2M4 4l2.5 2.5M17.5 17.5L20 20M4 20l2.5-2.5M17.5 6.5L20 4"/><circle cx="12" cy="12" r="4"/></svg>',
            cfg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.36.62 1 1 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>',
            plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
            pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13m0 0-4-4m4 4 4-4"/><path d="M3 17v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3"/></svg>',
            edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
            trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
            copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
            excel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M8 12l3 3-3 3M14 12l-3 3 3 3"/></svg>',
            empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>'
        };

        /* ============================================================
           RENDER
           ============================================================ */
        function render() {
            const nav = document.getElementById('nav');
            const items = [
                ['dashboard', 'Dashboard', 'dash'],
                ['cotizaciones', 'Cotizaciones', 'quote'],
                ['pagos', 'Pagos por cobrar', 'pay'],
                ['clientes', 'Clientes', 'client'],
                ['experiencia', 'Experiencia', 'exp'],
                ['config', 'Configuración', 'cfg']
            ];
            nav.innerHTML = items.map(([id, label, ic]) =>
                `<button class="nav-btn ${S.view === id ? 'active' : ''}" data-nav="${id}">${ICONS[ic]}<span>${label}</span></button>`
            ).join('');
            nav.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { S.view = b.dataset.nav;
                render(); });

            const main = document.getElementById('main');
            if (S.view === 'dashboard') main.innerHTML = viewDashboard();
            else if (S.view === 'cotizaciones') main.innerHTML = viewCotizaciones();
            else if (S.view === 'pagos') main.innerHTML = viewPagos();
            else if (S.view === 'clientes') main.innerHTML = viewClientes();
            else if (S.view === 'experiencia') main.innerHTML = viewExperiencia();
            else if (S.view === 'config') main.innerHTML = viewConfig();

            bindViewEvents();
        }

        /* ============================================================
           VIEWS
           ============================================================ */
        function viewDashboard() {
            const cots = S.cotizaciones;
            const pagos = S.pagos;
            const exp = S.experiencia;

            const totalCotizado = cots.reduce((s, c) => s + cotTotal(c), 0);
            const totalAceptado = cots.filter(c => c.estado === 'aceptada').reduce((s, c) => s + cotTotal(c), 0);
            const totalCobrado = pagos.reduce((s, p) => s + Number(p.montoPagado || 0), 0);
            const totalPorCobrar = pagos.reduce((s, p) => s + Math.max(0, Number(p.monto) - Number(p.montoPagado || 0)), 0);
            const totalExperiencia = exp.reduce((s, e) => s + Number(e.monto || 0), 0);

            const expPorCargo = {};
            exp.forEach(e => { expPorCargo[e.cargo] = (expPorCargo[e.cargo] || 0) + Number(e.monto || 0); });
            const topCargos = Object.entries(expPorCargo).sort((a, b) => b[1] - a[1]).slice(0, 4);
            const maxCargo = Math.max(1, ...topCargos.map(x => x[1]));

            return `
            <div class="page-head">
                <div><p class="eyebrow">Panel general</p><h1>Dashboard</h1><p>Resumen de cotizaciones, cobros y experiencia profesional.</p></div>
            </div>
            <div class="kpi-grid">
                <div class="kpi"><div class="label">Total cotizado</div><div class="val">${bs(totalCotizado)}</div><div class="sub">${cots.length} cotizaciones</div></div>
                <div class="kpi success"><div class="label">Total aceptado</div><div class="val">${bs(totalAceptado)}</div><div class="sub">${cots.filter(c=>c.estado==='aceptada').length} aceptadas</div></div>
                <div class="kpi accent"><div class="label">Cobrado a la fecha</div><div class="val">${bs(totalCobrado)}</div><div class="sub">${pagos.length} registros</div></div>
                <div class="kpi danger"><div class="label">Por cobrar</div><div class="val">${bs(totalPorCobrar)}</div><div class="sub">${pagos.filter(p=>pagoEstado(p)!=='pagado').length} pendientes</div></div>
                <div class="kpi"><div class="label">Experiencia total</div><div class="val">${bs(totalExperiencia)}</div><div class="sub">${exp.length} proyectos</div></div>
            </div>
            <div class="panel">
                <div class="panel-h"><h3>Monto de experiencia por cargo</h3></div>
                <div class="panel-body">
                    ${topCargos.length ? topCargos.map(([cargo, monto]) => `
                        <div style="display:grid;grid-template-columns:180px 1fr 80px;gap:10px;align-items:center;margin-bottom:10px;font-size:12.5px;">
                            <span style="font-size:12px;">${esc(cargo)}</span>
                            <div style="background:#E4DFC9;border-radius:2px;height:9px;overflow:hidden;">
                                <div style="height:100%;border-radius:2px;background:var(--accent);width:${(monto/maxCargo*100)||0}%;"></div>
                            </div>
                            <span style="font-family:'JetBrains Mono';font-size:11.5px;color:var(--text-soft);text-align:right;">${bs(monto)}</span>
                        </div>`).join('') : '<p style="color:var(--text-soft);font-size:13px;">Sin datos de experiencia aún.</p>'}
                </div>
            </div>`;
        }

        function viewCotizaciones() {
            const rows = [...S.cotizaciones].sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
            return `

            </div>
            <div class="panel">
                ${rows.length ? `<div class="table-wrap"><table>
                    <thead><tr><th>Fecha</th><th>Proyecto / Título</th><th>Cliente</th><th class="tright">Total</th><th>Estado</th><th></th></tr></thead>
                    <tbody>
                        ${rows.map(c => `

        function viewPagos() {
            const rows = [...S.pagos].sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
            return `
            <div class="page-head">
                <div><p class="eyebrow">Cobros</p><h1>Pagos por cobrar</h1><p>Registro simple de montos que te deben.</p></div>
                <button class="btn btn-primary" id="btn-new-pago">${ICONS.plus} Nuevo registro</button>

            <div class="panel">
                ${rows.length ? `<div class="table-wrap"><table>
                    <thead><tr><th>Fecha</th><th>Cliente / detalle</th><th class="tright">Monto</th><th class="tright">Pagado</th><th class="tright">Saldo</th><th>Estado</th><th></th></tr></thead>
                    <tbody>
                        ${rows.map(p => {
                            const saldo = Number(p.monto) - Number(p.montoPagado || 0);

                                <td class="tnum" style="white-space:nowrap;">${fmtDate(p.fecha)}</td>

                                <td class="tright tnum">${bs(p.monto)}</td>

        function viewClientes() {
            const list = [...S.clientes].sort((a, b) => a.nombre.localeCompare(b.nombre));
            return `
            <div class="page-head">
                <div><p class="eyebrow">Memoria</p><h1>Clientes y proyectos</h1><p>Se guardan automáticamente al registrar cotizaciones o pagos.</p></div>
            </div>
            <div class="panel"><div class="panel-body">
                <div style="display:flex;gap:8px;margin-bottom:18px;">

                        </div>

                    </div>`).join('') : `<div class="empty">${ICONS.empty}<div>Aún no hay clientes guardados.</div></div>`}
            </div></div>`;
        }

        function viewExperiencia() {
            const rows = [...S.experiencia].sort((a, b) => (b.desde || '').localeCompare(a.desde || ''));
            const now = new Date();
            const tenYearsAgo = new Date(now);
            tenYearsAgo.setFullYear(now.getFullYear() - 10);
            const recent = S.experiencia.filter(e => new Date(e.desde + 'T00:00:00') >= tenYearsAgo).sort((a, b) => (a.desde || '').localeCompare(b.desde || ''));

            let minDate = tenYearsAgo;
            let maxDate = now;
            if (recent.length) {
                const first = new Date(recent[0].desde + 'T00:00:00');
                const last = new Date(recent[recent.length - 1].hasta + 'T00:00:00');
                if (first < minDate) minDate = first;
                if (last > maxDate) maxDate = last;
            }
            const rangeMs = maxDate.getTime() - minDate.getTime();

            return `
            <div class="page-head">
                <div><p class="eyebrow">Portafolio</p><h1>Experiencia profesional</h1><p>Registro de proyectos ejecutados (últimos 10 años), con diagrama de Gantt y exportación a Excel con hoja de vida completa.</p></div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-primary" id="btn-new-exp">${ICONS.plus} Agregar proyecto</button>
                    <button class="btn btn-success" id="btn-export-excel">${ICONS.excel} Exportar hoja de vida a Excel</button>
                </div>
            </div>

            <div class="panel" style="margin-bottom:20px;">
                <div class="panel-h"><h3>Diagrama de Gantt — Últimos 10 años</h3></div>
                <div class="panel-body">
                    ${recent.length ? `
                        <div class="gantt-legend">
                            <span><span class="dot primary"></span> Proyectos activos</span>
                            <span><span class="dot light"></span> Proyectos en curso</span>
                        </div>
                        <div class="gantt-container">
                            ${recent.map(e => {
                                const desde = new Date(e.desde + 'T00:00:00');
                                const hasta = new Date(e.hasta + 'T00:00:00');
                                const startPct = Math.max(0, ((desde.getTime() - minDate.getTime()) / rangeMs) * 100);
                                const widthPct = Math.max(2, ((hasta.getTime() - desde.getTime()) / rangeMs) * 100);
                                const isActive = hasta >= now;
                                const dias = diffDays(e.desde, e.hasta);
                                return `<div class="gantt-row">
                                    <div class="gantt-label" title="${esc(e.objeto)}">${esc(e.objeto.slice(0, 35))}${e.objeto.length>35?'…':''}</div>
                                    <div class="gantt-track">
                                        <div class="gantt-bar ${isActive?'light':''}" style="left:${startPct}%;width:${Math.min(widthPct, 100)}%;">
                                            ${fmtDateShort(e.desde)} — ${fmtDateShort(e.hasta)}
                                        </div>
                                    </div>
                                    <div class="gantt-duration">${dias}d</div>
                                </div>`;
                            }).join('')}
                        </div>
                    ` : '<p style="color:var(--text-soft);font-size:13px;">No hay proyectos en los últimos 10 años.</p>'}
                </div>
            </div>

            <div class="panel">
                <div class="panel-h"><h3>Lista completa de proyectos</h3></div>
                <div class="panel-body">
                    ${rows.length ? `<div class="table-wrap"><table>
                        <thead><tr><th>#</th><th>Entidad / Empresa</th><th>Objeto</th><th class="tright">Monto</th><th>Cargo</th><th>Desde</th><th>Hasta</th><th></th></tr></thead>
                        <tbody>
                            ${rows.map((e, i) => `
                                <tr>
                                    <td class="tnum" style="text-align:center;">${i+1}</td>
                                    <td style="font-weight:500;">${esc(e.entidad)}</td>
                                    <td style="font-size:12px;max-width:250px;">${esc(e.objeto.slice(0, 60))}${e.objeto.length>60?'…':''}</td>
                                    <td class="tright tnum">${bs(e.monto)}</td>
                                    <td style="font-size:12px;">${esc(e.cargo)}</td>
                                    <td class="tnum" style="white-space:nowrap;">${fmtDate(e.desde)}</td>
                                    <td class="tnum" style="white-space:nowrap;">${fmtDate(e.hasta)}</td>
                                    <td>
                                        <div class="rowactions">
                                            <button class="iconbtn" title="Editar" data-edit-exp="${e.id}">${ICONS.edit}</button>
                                            <button class="iconbtn" title="Eliminar" data-del-exp="${e.id}">${ICONS.trash}</button>
                                        </div>
                                    </td>
                                </tr>`).join('')}
                        </tbody>
                    </table></div>` : `<div class="empty">${ICONS.empty}<div>Sin experiencia registrada aún.</div></div>`}
                </div>
            </div>`;
        }

        function viewConfig() {
            return `
            <div class="page-head"><div><p class="eyebrow">Ajustes</p><h1>Configuración</h1><p>Personaliza tu marca y conecta Firebase.</p></div></div>

        function exportExcelCompleto() {
            try {
                const wb = XLSX.utils.book_new();
                
                // ----- HOJA 1: DATOS PERSONALES -----
                const datosPersonalesData = [
                    ['HOJA DE VIDA ESPECIALISTA HIDRÓLOGO'],
                    [''],
                    ['1. DATOS GENERALES'],
                    [''],
                    ['Nombre Completo', S.datosPersonales.nombre],
                    ['Cédula de Identidad', S.datosPersonales.ci],
                    ['Lugar de Expedición', S.datosPersonales.lugarExpedicion],
                    ['Edad', S.datosPersonales.edad],
                    ['Nacionalidad', S.datosPersonales.nacionalidad],
                    ['Profesión', S.datosPersonales.profesion],
                    ['Número de Registro Profesional', S.datosPersonales.registroProfesional]
                ];
                const ws1 = XLSX.utils.aoa_to_sheet(datosPersonalesData);
                ws1['!cols'] = [{ wch: 30 }, { wch: 40 }];
                XLSX.utils.book_append_sheet(wb, ws1, 'Datos Generales');

                // ----- HOJA 2: FORMACIÓN ACADÉMICA -----
                const formacionData = [
                    ['2. FORMACIÓN ACADÉMICA'],
                    [''],
                    ['Universidad / Institución', 'Desde', 'Hasta', 'Grado Académico', 'Título en Provisión Nacional']
                ];
                S.formacion.forEach(f => {
                    formacionData.push([
                        f.institucion,
                        fmtDateExcel(f.desde),
                        fmtDateExcel(f.hasta),
                        f.grado,
                        fmtDateExcel(f.titulo)
                    ]);
                });
                const ws2 = XLSX.utils.aoa_to_sheet(formacionData);
                ws2['!cols'] = [{ wch: 45 }, { wch: 15 }, { wch: 15 }, { wch: 50 }, { wch: 20 }];
                XLSX.utils.book_append_sheet(wb, ws2, 'Formación Académica');

                // ----- HOJA 3: CURSOS DE ESPECIALIZACIÓN -----
                const cursosData = [
                    ['3. CURSOS DE ESPECIALIZACIÓN'],
                    [''],
                    ['Universidad / Institución', 'Desde', 'Hasta', 'Nombre del Curso', 'Duración en Horas']
                ];
                S.cursos.forEach(c => {
                    cursosData.push([
                        c.institucion,
                        fmtDateExcel(c.desde),
                        fmtDateExcel(c.hasta),
                        c.curso,
                        c.horas
                    ]);
                });
                const ws3 = XLSX.utils.aoa_to_sheet(cursosData);
                ws3['!cols'] = [{ wch: 45 }, { wch: 15 }, { wch: 15 }, { wch: 50 }, { wch: 18 }];
                XLSX.utils.book_append_sheet(wb, ws3, 'Cursos Especialización');

                // ----- HOJA 4: EXPERIENCIA (últimos 10 años) -----
                const now = new Date();
                const tenYearsAgo = new Date(now);
                tenYearsAgo.setFullYear(now.getFullYear() - 10);
                const expFiltrada = S.experiencia.filter(e => new Date(e.desde + 'T00:00:00') >= tenYearsAgo);
                const expData = [
                    ['4. EXPERIENCIA GENERAL (Últimos 10 años)'],
                    [''],
                    ['N°', 'Entidad / Empresa', 'Objeto', 'Monto (Bs)', 'Cargo', 'Desde', 'Hasta']
                ];
                expFiltrada.sort((a, b) => (a.desde || '').localeCompare(b.desde || ''));
                expFiltrada.forEach((e, i) => {
                    expData.push([
                        i + 1,
                        e.entidad,
                        e.objeto,
                        Number(e.monto).toFixed(2),
                        e.cargo,
                        fmtDateExcel(e.desde),
                        fmtDateExcel(e.hasta)
                    ]);
                });
                const ws4 = XLSX.utils.aoa_to_sheet(expData);
                ws4['!cols'] = [{ wch: 6 }, { wch: 30 }, { wch: 50 }, { wch: 16 }, { wch: 30 }, { wch: 14 }, { wch: 14 }];
                XLSX.utils.book_append_sheet(wb, ws4, 'Experiencia');

                // Guardar archivo
                XLSX.writeFile(wb, `Hoja_Vida_Ing_Antequera_${new Date().toISOString().slice(0,10)}.xlsx`);
                toast('Hoja de vida exportada a Excel con todas las secciones.');
            } catch (e) {
                console.error(e);
                toast('Error al exportar: ' + e.message);
            }
        }

        function openCotModal(cot) {
            const isNew = !cot;
            const c = cot ? JSON.parse(JSON.stringify(cot)) : { id: uid(), fecha: new Date().toISOString().slice(0, 10), proyecto: '', cliente: '', titulo: '', items: [{ id: uid(), actividad: '', pu: 0, unidad: '', cantidad: 1 }], descuento: 0, plazoDias: 5, nota: S.config.defaultNota || '', entregables: S.config.defaultEntregables || '', estado: 'borrador' };
            const overlay = createModal(isNew ? 'Nueva cotización' : 'Editar cotización', `
                <div class="field"><label>Título del trabajo</label><input id="f-titulo" value="${attr(c.titulo)}" placeholder="Ej. Diseño hidráulico de..."></div>
                <div class="row2">
                    <div class="field"><label>Proyecto</label><input id="f-proyecto" list="dl-proyectos" value="${attr(c.proyecto)}"></div>
                    <div class="field"><label>Cliente</label><input id="f-cliente" list="dl-clientes" value="${attr(c.cliente)}"></div>
                </div>
                <datalist id="dl-clientes">${S.clientes.map(cl => `<option value="${attr(cl.nombre)}">`).join('')}</datalist>
                <datalist id="dl-proyectos">${[...new Set(S.clientes.flatMap(cl => cl.proyectos))].map(p => `<option value="${attr(p)}">`).join('')}</datalist>
                <div class="row3">
                    <div class="field"><label>Fecha</label><input type="date" id="f-fecha" value="${attr(c.fecha)}"></div>
                    <div class="field"><label>Plazo (días)</label><input type="number" id="f-plazo" value="${c.plazoDias||0}"></div>
                    <div class="field"><label>Estado</label>
                        <select id="f-estado">
                            ${['borrador','enviada','aceptada','rechazada'].map(e => `<option value="${e}" ${c.estado===e?'selected':''}>${e}</option>`).join('')}
                        </select>
                    </div>
                </div>
                <label style="display:block;font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-soft);margin-bottom:8px;">Ítems</label>
                <div class="items-block" id="items-block">${c.items.map(it => itemRowHtml(it)).join('')}</div>
                <button type="button" class="additem" id="btn-add-item" style="font-size:12px;color:var(--primary);background:none;border:1px dashed var(--border);border-radius:3px;padding:7px 10px;cursor:pointer;width:100%;margin-bottom:14px;">+ Agregar ítem</button>
                <div class="row2">
                    <div class="field"><label>Descuento [Bs]</label><input type="number" step="0.01" id="f-descuento" value="${c.descuento||0}"></div>
                    <div class="field"><label>&nbsp;</label><div style="font-size:12.5px;color:var(--text-soft);">Subtotal: <b id="f-subtotal-view">${bs(cotSubtotal(c))}</b></div></div>
                </div>
                <div class="field"><label>Entregables</label><textarea id="f-entregables" style="min-height:90px;">${esc(c.entregables||'')}</textarea></div>
                <div class="field"><label>Nota / alcance</label><textarea id="f-nota">${esc(c.nota||'')}</textarea></div>
                <div style="border-top:2px solid var(--primary);margin-top:6px;padding-top:12px;">
                    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:15px;color:var(--primary);"><span>Monto final</span><span id="f-total-view">${bs(cotTotal(c))}</span></div>
                </div>
            `);

            function recalc() {
                const rows = overlay.querySelectorAll('.item-row');
                let subtotal = 0;
                rows.forEach(r => { const pu = Number(r.querySelector('.it-pu').value) || 0;
                    const cant = Number(r.querySelector('.it-cantidad').value) || 0;
                    subtotal += pu * cant; });
                const desc = Number(overlay.querySelector('#f-descuento').value) || 0;
                overlay.querySelector('#f-subtotal-view').textContent = bs(subtotal);
                overlay.querySelector('#f-total-view').textContent = bs(subtotal - desc);
            }
            overlay.addEventListener('input', recalc);
            overlay.querySelector('#btn-add-item').onclick = () => {
                const block = overlay.querySelector('#items-block');
                block.insertAdjacentHTML('beforeend', itemRowHtml({ id: uid(), actividad: '', pu: 0, unidad: '', cantidad: 1 }));
            };
            overlay.querySelector('#items-block').addEventListener('click', e => {
                if (e.target.classList.contains('item-remove')) {
                    const row = e.target.closest('.item-row');
                    if (overlay.querySelectorAll('.item-row').length > 1) { row.remove();
                        recalc(); } else toast('La cotización necesita al menos un ítem.');
                }
            });
            overlay.querySelector('#m-save').onclick = async () => {
                const items = [...overlay.querySelectorAll('.item-row')].map(r => ({
                    id: r.dataset.item,
                    actividad: r.querySelector('.it-actividad').value.trim(),
                    pu: Number(r.querySelector('.it-pu').value) || 0,
                    unidad: r.querySelector('.it-unidad').value.trim(),
                    cantidad: Number(r.querySelector('.it-cantidad').value) || 0
                }));
                const titulo = overlay.querySelector('#f-titulo').value.trim();
                if (!titulo) { toast('Ponle un título a la cotización.'); return; }
                const nuevo = {
                    id: c.id,
                    fecha: overlay.querySelector('#f-fecha').value,
                    proyecto: overlay.querySelector('#f-proyecto').value.trim(),
                    cliente: overlay.querySelector('#f-cliente').value.trim(),
                    titulo,
                    items,
                    descuento: Number(overlay.querySelector('#f-descuento').value) || 0,
                    plazoDias: Number(overlay.querySelector('#f-plazo').value) || 0,
                    entregables: overlay.querySelector('#f-entregables').value.trim(),
                    nota: overlay.querySelector('#f-nota').value.trim(),
                    estado: overlay.querySelector('#f-estado').value
                };
                if (isNew) S.cotizaciones.push(nuevo);
                else S.cotizaciones = S.cotizaciones.map(x => x.id === nuevo.id ? nuevo : x);
                await saveCotizaciones();
                if (nuevo.cliente) {
                    let cli = S.clientes.find(c => c.nombre.toLowerCase() === nuevo.cliente.toLowerCase());
                    if (!cli) { cli = { id: uid(), nombre: nuevo.cliente, proyectos: [] };
                        S.clientes.push(cli); }
                    if (nuevo.proyecto && !cli.proyectos.some(p => p.toLowerCase() === nuevo.proyecto.toLowerCase())) {
                        cli.proyectos.push(nuevo.proyecto);
                    }
                    await saveClientes();
                }
                close(); render();
                toast('Cotización guardada.');
            };
        }

        function createModal(title, bodyHtml) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `<div class="modal">
                <div class="modal-h"><h3>${title}</h3><button class="close" id="m-close">&times;</button></div>
                <div class="modal-body">${bodyHtml}</div>
                <div class="modal-foot">
                    <button class="btn btn-ghost" id="m-cancel">Cancelar</button>
                    <button class="btn btn-primary" id="m-save">Guardar</button>
                </div>
            </div>`;
            document.body.appendChild(overlay);
            const close = () => overlay.remove();
            overlay.querySelector('#m-close').onclick = close;
            overlay.querySelector('#m-cancel').onclick = close;
            overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });
            return overlay;
        }

        /* ============================================================
           PDF EXPORT
           ============================================================ */
        function exportPDF(c) {
            if (!c) { toast('No se encontró la cotización.'); return; }
            if (!window.jspdf) { toast('La librería de PDF aún está cargando.'); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: 'a4' });
            const pageW = doc.internal.pageSize.getWidth();
            const blueprint = [31, 78, 95];
            let y = 18;

            if (S.config.logo) {
                try { doc.addImage(S.config.logo, 'PNG', 15, 10, 16, 16); } catch (e) {}
            }

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(17);
            doc.setTextColor(...blueprint);
            doc.text('COTIZACIÓN', pageW / 2, y, { align: 'center' });
            y += 7;

            doc.setFontSize(11);
            doc.setTextColor(30, 36, 41);
            const titleLines = doc.splitTextToSize(c.titulo || '', 170);
            doc.text(titleLines, pageW / 2, y, { align: 'center' });
            y += titleLines.length * 5.5 + 4;

            doc.setDrawColor(...blueprint);
            doc.setLineWidth(0.5);
            doc.line(15, y, pageW - 15, y);
            y += 7;

            doc.setFontSize(10);
            doc.setFont('helvetica', 'bold');
            doc.text('Proyecto:', 15, y);
            doc.setFont('helvetica', 'normal');
            const projLines = doc.splitTextToSize(c.proyecto || '—', 150);
            doc.text(projLines, 38, y);
            y += Math.max(5, projLines.length * 5);
            doc.setFont('helvetica', 'bold');
            doc.text('Cliente:', 15, y);
            doc.setFont('helvetica', 'normal');
            doc.text(c.cliente || '—', 38, y);
            y += 8;

            doc.autoTable({
                startY: y,
                head: [['Nº', 'Actividad', 'P.U. [Bs]', 'Unidad', 'Cant.', 'Total [Bs]']],
                body: c.items.map((it, i) => [String(i + 1), it.actividad || '', (Number(it.pu) || 0).toFixed(2), it.unidad || '', String(it.cantidad || 0), ((Number(it.pu) || 0) * (Number(it.cantidad) || 0)).toFixed(2)]),
                styles: { fontSize: 8.5, cellPadding: 2.4, valign: 'top', textColor: [30, 36, 41] },
                headStyles: { fillColor: blueprint, textColor: 255, fontStyle: 'bold', fontSize: 8.5 },
                alternateRowStyles: { fillColor: [247, 245, 236] },
                columnStyles: { 0: { cellWidth: 8, halign: 'center' }, 1: { cellWidth: 92 }, 2: { cellWidth: 20, halign: 'right' }, 3: { cellWidth: 28 }, 4: { cellWidth: 13, halign: 'center' }, 5: { cellWidth: 19, halign: 'right' } },
                margin: { left: 15, right: 15 }
            });
            y = doc.lastAutoTable.finalY + 8;

            const subtotal = cotSubtotal(c);
            const total = cotTotal(c);
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(60, 66, 71);
            doc.text(`Subtotal [Bs]: ${subtotal.toFixed(2)}`, pageW - 15, y, { align: 'right' });
            y += 6;
            if (Number(c.descuento) > 0) {
                doc.text(`Descuento / anticipo [Bs]: ${Number(c.descuento).toFixed(2)}`, pageW - 15, y, { align: 'right' });
                y += 6;
            }
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(12);
            doc.setTextColor(...blueprint);
            doc.text(`Monto final [Bs]: ${total.toFixed(2)}`, pageW - 15, y, { align: 'right' });
            y += 9;

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.setTextColor(30, 36, 41);
            doc.text(`Plazo a partir del anticipo: ${c.plazoDias||0} días`, 15, y);
            y += 9;

            if (c.entregables) {
                if (y > 245) { doc.addPage();
                    y = 20; }
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(9);
                doc.setTextColor(30, 36, 41);
                doc.text('Producto a presentar', 15, y);
                y += 5;
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8.5);
                doc.setTextColor(60, 66, 71);
                const delLines = doc.splitTextToSize(c.entregables, pageW - 30);
                doc.text(delLines, 15, y);
                y += delLines.length * 3.9 + 9;
            }

            if (c.nota) {
                if (y > 255) { doc.addPage();
                    y = 20; }
                doc.setFontSize(8);
                doc.setTextColor(100, 105, 110);
                const noteLines = doc.splitTextToSize(`Nota: ${c.nota}`, pageW - 30);
                doc.text(noteLines, 15, y);
                y += noteLines.length * 3.8 + 10;
            }

            if (y > 255) { doc.addPage();
                y = 20; }
            doc.setFontSize(9);
            doc.setTextColor(30, 36, 41);
            doc.text(`Fecha: ${fmtDate(c.fecha)}`, 15, y);
            y += 16;
            doc.setFont('helvetica', 'bold');
            doc.text(S.config.nombre || '', 15, y);
            y += 5;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.text(S.config.rni || '', 15, y);

            const safeName = (c.proyecto || 'cotizacion').replace(/[^a-z0-9]+/gi, '_').slice(0, 40);
            doc.save(`Cotizacion_${safeName}_${c.fecha}.pdf`);
            toast('PDF generado.');
        }

        /* ============================================================
           EVENT BINDING
           ============================================================ */
        function bindViewEvents() {
            const main = document.getElementById('main');

            // LOGIN / REGISTER
            document.getElementById('btn-login').onclick = async () => {
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                if (!email || !password) { showLoginError('Completa todos los campos.'); return; }
                await login(email, password);
            };
            document.getElementById('btn-register').onclick = async () => {
                const email = document.getElementById('register-email').value.trim();
                const password = document.getElementById('register-password').value;
                if (!email || !password) { showLoginError('Completa todos los campos.'); return; }
                if (password.length < 6) { showLoginError('La contraseña debe tener al menos 6 caracteres.'); return; }
                await register(email, password);
            };
            document.getElementById('goto-register').onclick = () => {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
                hideLoginError();
            };
            document.getElementById('goto-login').onclick = () => {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
                hideLoginError();
            };
            document.getElementById('btn-logout').onclick = logout;

            // Enter key para login/register
            document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-login').click(); });
            document.getElementById('register-password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-register').click(); });

            // Cotizaciones
            const btnNew = document.getElementById('btn-new-cot');
            if (btnNew) btnNew.onclick = () => openCotModal(null);
            main.querySelectorAll('[data-edit-cot]').forEach(b => b.onclick = () => openCotModal(S.cotizaciones.find(c => c.id === b.dataset.editCot)));
            main.querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => exportPDF(S.cotizaciones.find(c => c.id === b.dataset.pdf)));
            main.querySelectorAll('[data-dup-cot]').forEach(b => b.onclick = async () => {
                const orig = S.cotizaciones.find(c => c.id === b.dataset.dupCot);
                const copy = JSON.parse(JSON.stringify(orig));
                copy.id = uid();
                copy.items = copy.items.map(it => ({ ...it, id: uid() }));
                copy.estado = 'borrador';
                copy.fecha = new Date().toISOString().slice(0, 10);
                S.cotizaciones.push(copy);
                await saveCotizaciones();
                render();
                toast('Cotización duplicada.');
            });
            main.querySelectorAll('[data-del-cot]').forEach(b => b.onclick = async () => {
                if (!confirm('¿Eliminar esta cotización?')) return;
                S.cotizaciones = S.cotizaciones.filter(c => c.id !== b.dataset.delCot);
                await saveCotizaciones();
                render();
                toast('Cotización eliminada.');
            });

            // Pagos
            const btnNewPago = document.getElementById('btn-new-pago');
            if (btnNewPago) btnNewPago.onclick = () => openPagoModal(null);
            main.querySelectorAll('[data-edit-pago]').forEach(b => b.onclick = () => openPagoModal(S.pagos.find(p => p.id === b.dataset.editPago)));
            main.querySelectorAll('[data-del-pago]').forEach(b => b.onclick = async () => {
                if (!confirm('¿Eliminar este registro de pago?')) return;
                S.pagos = S.pagos.filter(p => p.id !== b.dataset.delPago);
                await savePagos();
                render();
                toast('Registro eliminado.');
            });

            // Clientes
            const btnAddCliente = document.getElementById('btn-add-cliente');
            if (btnAddCliente) btnAddCliente.onclick = async () => {
                const val = document.getElementById('new-cliente-nombre').value.trim();
                if (!val) { toast('Escribe un nombre de cliente.'); return; }
                let cli = S.clientes.find(c => c.nombre.toLowerCase() === val.toLowerCase());
                if (!cli) { cli = { id: uid(), nombre: val, proyectos: [] };
                    S.clientes.push(cli);
                    await saveClientes(); }
                render();
                toast('Cliente agregado.');
            };
            main.querySelectorAll('[data-del-cliente]').forEach(b => b.onclick = async () => {
                if (!confirm('¿Eliminar este cliente?')) return;
                S.clientes = S.clientes.filter(c => c.id !== b.dataset.delCliente);
                await saveClientes();
                render();
                toast('Cliente eliminado.');
            });
            main.querySelectorAll('[data-del-proy]').forEach(b => b.onclick = async () => {
                const [cid, proy] = b.dataset.delProy.split('::');
                const cli = S.clientes.find(c => c.id === cid);
                if (cli) { cli.proyectos = cli.proyectos.filter(p => p !== proy);
                    await saveClientes();
                    render(); }
            });
            main.querySelectorAll('[data-add-proy]').forEach(b => b.onclick = async () => {
                const cid = b.dataset.addProy;
                const input = main.querySelector(`[data-new-proy-input="${cid}"]`);
                const val = input.value.trim();
                if (!val) return;
                const cli = S.clientes.find(c => c.id === cid);
                if (cli && !cli.proyectos.some(p => p.toLowerCase() === val.toLowerCase())) {
                    cli.proyectos.push(val);
                    await saveClientes();
                    render();
                    toast('Proyecto agregado.');
                }
            });

            // Experiencia
            const btnNewExp = document.getElementById('btn-new-exp');
            if (btnNewExp) btnNewExp.onclick = () => openExpModal(null);
            main.querySelectorAll('[data-edit-exp]').forEach(b => b.onclick = () => openExpModal(S.experiencia.find(e => e.id === b.dataset.editExp)));
            main.querySelectorAll('[data-del-exp]').forEach(b => b.onclick = async () => {
                if (!confirm('¿Eliminar este proyecto?')) return;
                S.experiencia = S.experiencia.filter(e => e.id !== b.dataset.delExp);
                await saveExperiencia();
                render();
                toast('Proyecto eliminado.');
            });
            
            // Botón exportar Excel con hoja de vida completa
            const btnExport = document.getElementById('btn-export-excel');
            if (btnExport) btnExport.onclick = exportExcelCompleto;

            // Configuración
            const btnConnect = document.getElementById('btn-connect-firebase');
            if (btnConnect) btnConnect.onclick = () => {
                const input = document.getElementById('firebase-config-input');
                try {
                    const cfg = JSON.parse(input.value);
                    connectFirebase(cfg);
                } catch (e) { toast('JSON inválido. Verifica la configuración.'); }
            };
            const btnDisconnect = document.getElementById('btn-disconnect-firebase');
            if (btnDisconnect) btnDisconnect.onclick = () => { if (confirm('¿Desconectar Firebase?')) disconnectFirebase(); };

            let pendingLogo = S.config.logo;
            const fileInput = document.getElementById('cfg-logo-file');
            if (fileInput) fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => { pendingLogo = reader.result;
                    document.getElementById('logo-preview').innerHTML = `<img src="${pendingLogo}" style="width:100%;height:100%;object-fit:cover;">`; };
                reader.readAsDataURL(file);
            };
            const btnRemoveLogo = document.getElementById('btn-remove-logo');
            if (btnRemoveLogo) btnRemoveLogo.onclick = () => { pendingLogo = null;
                document.getElementById('logo-preview').innerHTML = '—'; };

            const btnSaveCfg = document.getElementById('btn-save-cfg');
            if (btnSaveCfg) btnSaveCfg.onclick = async () => {
                S.config.nombre = document.getElementById('cfg-nombre').value.trim();
                S.config.rni = document.getElementById('cfg-rni').value.trim();
                if (pendingLogo !== undefined) S.config.logo = pendingLogo;
                await saveConfig();
                if (S.config.logo) {
                    document.getElementById('brand-stamp').innerHTML = `<img src="${S.config.logo}" alt="logo">`;
                }
                render();
                toast('Configuración guardada.');
            };
        }

        /* ============================================================
           INICIO
           ============================================================ */
        initFirebase();
    </script>
</body>
</html>
